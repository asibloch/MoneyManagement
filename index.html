<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ניהול תקציב אישי</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #edf2f7;
            --subtext-color: #718096;
            --primary: #2bc48a;
            --danger: #e74c3c;
            --accent: #3498db;
            --input-bg: #ffffff;
        }

        [data-theme="dark"] {
            --bg-color: #1a202c;
            --card-bg: #2d3748;
            --text-color: #f7fafc;
            --border-color: #4a5568;
            --subtext-color: #a0aec0;
            --input-bg: #1a202c;
        }

        /* 1. מניעת גלישה הרמטית ברמת כל האלמנטים */
        *, *::before, *::after {
            box-sizing: border-box;
            max-width: 100%;
        }

        /* 2. חסימת גלילה אופקית ב-HTML וב-BODY */
        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden !important;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 12px;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s, color 0.3s;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .container {
            width: 100%;
            max-width: 680px;
        }

        .auth-container {
            max-width: 400px;
            margin: 10px auto;
            width: 100%;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 8px;
            flex-wrap: wrap; /* מאפשר לרדת שורה במסכים ממש קטנים */
        }

        .user-greeting {
            font-size: 1rem;
            font-weight: bold;
            color: var(--accent);
            margin-top: 4px;
        }

        .user-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        h1 { 
            margin: 0; 
            font-size: 1.3rem; 
        }

        .btn-small {
            padding: 6px 10px;
            font-size: 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
            white-space: nowrap;
        }

        .theme-toggle-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 10px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .card {
            background-color: var(--card-bg);
            padding: 14px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 14px;
            width: 100%;
        }

        h2 {
            margin-top: 0;
            font-size: 1.05rem;
            color: var(--text-color);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 12px;
            width: 100%;
        }

        /* שדות הטופס יופיעו תמיד בטור יחיד בנייד */
        .form-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        @media (min-width: 500px) {
            .form-row {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }
        }

        input, select, button {
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            background-color: var(--input-bg);
            color: var(--text-color);
            width: 100%;
            min-width: 0; /* מונע מאלמנטים של flex/grid לפרוץ חצי מסך */
        }

        input:focus, select:focus { outline: none; border-color: var(--accent); }

        /* שדה סיסמה עם עינית */
        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            padding-left: 40px;
        }

        .toggle-password {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            user-select: none;
            font-size: 1.1rem;
            opacity: 0.7;
            background: none;
            border: none;
            padding: 0;
            width: auto;
        }

        button.btn-primary {
            background-color: var(--primary);
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        .checkbox-label {
            display: flex; 
            align-items: center; 
            gap: 8px; 
            font-size: 0.9rem; 
            cursor: pointer; 
            margin-top: 4px;
        }

        .checkbox-label input {
            width: auto;
        }

        .summary-grid {
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 8px; 
            margin-top: 12px;
        }

        .summary-item {
            background-color: var(--bg-color); 
            padding: 10px 6px; 
            border-radius: 8px; 
            text-align: center;
            font-size: 0.85rem;
        }

        .summary-item span { 
            display: block; 
            font-size: 1.05rem; 
            font-weight: bold; 
            margin-top: 4px; 
        }
        
        .income-text { color: var(--primary); }
        .expense-text { color: var(--danger); }

        .progress-container {
            width: 100%; 
            background-color: var(--border-color); 
            border-radius: 8px; 
            height: 10px; 
            margin-top: 8px; 
            overflow: hidden;
        }

        .progress-bar { height: 100%; width: 0%; background-color: var(--primary); transition: width 0.3s; }

        .category-group {
            background-color: var(--bg-color);
            border-right: 5px solid var(--theme-color, #3498db);
            border-radius: 8px; 
            padding: 10px; 
            margin-bottom: 10px;
            width: 100%;
        }

        .category-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-weight: bold; 
            font-size: 0.9rem; 
            margin-bottom: 6px; 
        }
        
        .category-actions { display: flex; align-items: center; gap: 6px; }
        .category-total { font-size: 0.75rem; color: white; background-color: var(--theme-color, #3498db); padding: 2px 6px; border-radius: 10px; white-space: nowrap; }

        ul.item-list { list-style: none; padding: 0; margin: 0; width: 100%; }
        ul.item-list li { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 8px 0; 
            border-bottom: 1px solid var(--border-color); 
            gap: 6px; 
            font-size: 0.85rem;
            min-width: 0;
        }
        
        ul.item-list li span:first-child {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        ul.item-list li:last-child { border-bottom: none; }

        .delete-btn { background: none; border: none; color: var(--subtext-color); cursor: pointer; font-size: 1rem; width: auto; padding: 2px 6px; }
        
        .auth-toggle-link { color: var(--accent); cursor: pointer; text-align: center; font-size: 0.85rem; margin-top: 8px; }
        .error-message { color: var(--danger); font-size: 0.85rem; margin-top: 5px; text-align: center; }
        .loading-text { text-align: center; color: var(--subtext-color); font-size: 0.9rem; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- מסך התחברות / הרשמה -->
    <div id="authSection" class="auth-container">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2 id="authTitle" style="border: none; margin: 0;">התחברות</h2>
                <button class="theme-toggle-btn" onclick="toggleTheme()">🌙</button>
            </div>

            <!-- טופס התחברות -->
            <form id="loginForm" class="form-group" onsubmit="handleLogin(event)">
                <input type="email" id="loginEmail" placeholder="אימייל" required>
                <div class="password-wrapper">
                    <input type="password" id="loginPassword" placeholder="סיסמה" required>
                    <span class="toggle-password" onclick="togglePasswordVisibility('loginPassword', this)">👁️</span>
                </div>
                <button type="submit" class="btn-primary">התחבר</button>
                <div class="auth-toggle-link" onclick="showRegister()">אין לך חשבון? לחץ כאן להרשמה</div>
            </form>

            <!-- טופס הרשמה -->
            <form id="registerForm" class="form-group" style="display: none;" onsubmit="handleRegister(event)">
                <input type="text" id="regName" placeholder="שם מלא" required>
                <input type="email" id="regEmail" placeholder="אימייל" required>
                <div class="password-wrapper">
                    <input type="password" id="regPassword" placeholder="סיסמה" required>
                    <span class="toggle-password" onclick="togglePasswordVisibility('regPassword', this)">👁️</span>
                </div>
                <button type="submit" class="btn-primary">הירשם</button>
                <div class="auth-toggle-link" onclick="showLogin()">כבר נרשמת? לחץ כאן להתחברות</div>
            </form>

            <div id="authError" class="error-message"></div>
        </div>
    </div>

    <!-- מסך האפליקציה הראשי -->
    <div id="appSection" class="container" style="display: none;">
        <div class="header-top">
            <div>
                <h1>ניהול תקציב אישי</h1>
                <div id="userGreeting" class="user-greeting"></div>
            </div>
            <div class="user-actions">
                <button class="theme-toggle-btn" onclick="toggleTheme()">🌙</button>
                <button class="btn-small" onclick="logout()">התנתק</button>
            </div>
        </div>

        <!-- כרטיס סיכום -->
        <div class="card">
            <h2>סיכום תקציבי</h2>
            <div class="summary-grid">
                <div class="summary-item">
                    סך הכנסות
                    <span id="totalIncome" class="income-text">₪0</span>
                </div>
                <div class="summary-item">
                    סך הוצאות
                    <span id="totalExpense" class="expense-text">₪0</span>
                </div>
            </div>
            <div style="margin-top: 12px;">
                <div style="display: flex; justify-content: space-between; font-size: 0.85rem;">
                    <span>ניצול התקציב:</span>
                    <span id="budgetPercent">0%</span>
                </div>
                <div class="progress-container">
                    <div id="progressBar" class="progress-bar"></div>
                </div>
            </div>
        </div>

        <!-- כרטיס הוספת תנועה -->
        <div class="card">
            <h2>הוספת תנועה חדשה</h2>
            <form id="transactionForm" class="form-group" onsubmit="handleAddTransaction(event)">
                <div class="form-row">
                    <select id="transType" onchange="updateCategories()">
                        <option value="expense">הוצאה</option>
                        <option value="income">הכנסה</option>
                    </select>
                    <select id="transCategory" required></select>
                </div>
                <div class="form-row">
                    <input type="text" id="transTitle" placeholder="תיאור (לדוגמה: בסופר)" required>
                    <input type="number" id="transAmount" placeholder="סכום (₪)" step="0.01" min="0.01" required>
                </div>
                <label class="checkbox-label">
                    <input type="checkbox" id="transFixed">
                    תנועה קבועה (חודשית)
                </label>
                <button type="submit" class="btn-primary">הוסף תנועה</button>
            </form>
        </div>

        <!-- כרטיס פירוט לפי קטגוריות -->
        <div class="card">
            <h2>פירוט לפי קטגוריות</h2>
            <div id="loadingText" class="loading-text">טוען נתונים...</div>
            <div id="categoriesList"></div>
        </div>
    </div>

    <script>
        // הגדרת Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCsW-REPLACE-WITH-YOUR-KEY",
            authDomain: "budget-app-asi.firebaseapp.com",
            projectId: "budget-app-asi",
            storageBucket: "budget-app-asi.appspot.com",
            messagingSenderId: "1028723237190",
            appId: "1:1028723237190:web:1234567890"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // קטגוריות מובנות
        const categoriesData = {
            expense: [
                { name: "מזון וקניות", color: "#e74c3c" },
                { name: "מגורים וממשל", color: "#e67e22" },
                { name: "תחבורה", color: "#f1c40f" },
                { name: "בילויים ופנאי", color: "#9b59b6" },
                { name: "שונות", color: "#95a5a6" }
            ],
            income: [
                { name: "משכורת", color: "#2ecc71" },
                { name: "השקעות", color: "#1abc9c" },
                { name: "מתנות/אחר", color: "#3498db" }
            ]
        };

        let currentUser = null;
        let transactions = [];

        window.onload = function() {
            updateCategories();
            const savedUser = localStorage.getItem('budgetUser');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                showApp();
            }
        };

        function togglePasswordVisibility(inputId, iconElement) {
            const passwordInput = document.getElementById(inputId);
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                iconElement.textContent = "🙈";
            } else {
                passwordInput.type = "password";
                iconElement.textContent = "👁️";
            }
        }

        function showRegister() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'flex';
            document.getElementById('authTitle').textContent = 'הרשמה';
            document.getElementById('authError').textContent = '';
        }

        function showLogin() {
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('loginForm').style.display = 'flex';
            document.getElementById('authTitle').textContent = 'התחברות';
            document.getElementById('authError').textContent = '';
        }

        async function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim().toLowerCase();
            const password = document.getElementById('regPassword').value.trim();
            const errorDiv = document.getElementById('authError');

            try {
                const userDoc = await db.collection('users').doc(email).get();
                if (userDoc.exists) {
                    errorDiv.textContent = "משתמש עם אימייל זה כבר קיים במערכת";
                    return;
                }

                const newUser = { name, email, password };
                await db.collection('users').doc(email).set(newUser);
                
                currentUser = newUser;
                localStorage.setItem('budgetUser', JSON.stringify(currentUser));
                showApp();
            } catch (err) {
                errorDiv.textContent = "שגיאה בהרשמה: " + err.message;
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim().toLowerCase();
            const password = document.getElementById('loginPassword').value.trim();
            const errorDiv = document.getElementById('authError');

            try {
                const userDoc = await db.collection('users').doc(email).get();
                if (!userDoc.exists || userDoc.data().password !== password) {
                    errorDiv.textContent = "אימייל או סיסמה לא נכונים";
                    return;
                }

                currentUser = userDoc.data();
                localStorage.setItem('budgetUser', JSON.stringify(currentUser));
                showApp();
            } catch (err) {
                errorDiv.textContent = "שגיאה בהתחברות: " + err.message;
            }
        }

        function logout() {
            localStorage.removeItem('budgetUser');
            currentUser = null;
            document.getElementById('appSection').style.display = 'none';
            document.getElementById('authSection').style.display = 'block';
        }

        function showApp() {
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('appSection').style.display = 'block';
            document.getElementById('userGreeting').textContent = `שלום, ${currentUser.name}`;
            loadTransactions();
        }

        function loadTransactions() {
            document.getElementById('loadingText').style.display = 'block';
            db.collection('users').doc(currentUser.email).collection('transactions')
                .onSnapshot(snapshot => {
                    transactions = [];
                    snapshot.forEach(doc => {
                        transactions.push({ id: doc.id, ...doc.data() });
                    });
                    document.getElementById('loadingText').style.display = 'none';
                    renderApp();
                }, err => {
                    document.getElementById('loadingText').textContent = "שגיאה בטעינת נתונים";
                });
        }

        function updateCategories() {
            const type = document.getElementById('transType').value;
            const select = document.getElementById('transCategory');
            select.innerHTML = '';
            categoriesData[type].forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat.name;
                opt.textContent = cat.name;
                select.appendChild(opt);
            });
        }

        async function handleAddTransaction(e) {
            e.preventDefault();
            const type = document.getElementById('transType').value;
            const category = document.getElementById('transCategory').value;
            const title = document.getElementById('transTitle').value.trim();
            const amount = parseFloat(document.getElementById('transAmount').value);
            const isFixed = document.getElementById('transFixed').checked;

            if (!title || isNaN(amount)) return;

            const newTrans = {
                type,
                category,
                title,
                amount,
                isFixed,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            await db.collection('users').doc(currentUser.email).collection('transactions').add(newTrans);
            
            document.getElementById('transTitle').value = '';
            document.getElementById('transAmount').value = '';
            document.getElementById('transFixed').checked = false;
        }

        async function deleteTransaction(id) {
            if (confirm("האם למחוק תנועה זו?")) {
                await db.collection('users').doc(currentUser.email).collection('transactions').doc(id).delete();
            }
        }

        function renderApp() {
            let totalIncome = 0;
            let totalExpense = 0;
            const categoriesMap = {};

            transactions.forEach(t => {
                if (t.type === 'income') {
                    totalIncome += t.amount;
                } else {
                    totalExpense += t.amount;
                }

                if (!categoriesMap[t.category]) {
                    categoriesMap[t.category] = { total: 0, items: [], type: t.type };
                }
                categoriesMap[t.category].total += t.amount;
                categoriesMap[t.category].items.push(t);
            });

            document.getElementById('totalIncome').textContent = `₪${totalIncome.toLocaleString()}`;
            document.getElementById('totalExpense').textContent = `₪${totalExpense.toLocaleString()}`;

            const percent = totalIncome > 0 ? Math.min(Math.round((totalExpense / totalIncome) * 100), 100) : 0;
            document.getElementById('budgetPercent').textContent = `${percent}%`;
            document.getElementById('progressBar').style.width = `${percent}%`;
            document.getElementById('progressBar').style.backgroundColor = percent > 90 ? 'var(--danger)' : 'var(--primary)';

            const catContainer = document.getElementById('categoriesList');
            catContainer.innerHTML = '';

            const allCategories = [...categoriesData.expense, ...categoriesData.income];

            Object.keys(categoriesMap).forEach(catName => {
                const catData = categoriesMap[catName];
                const catInfo = allCategories.find(c => c.name === catName) || { color: '#3498db' };

                const group = document.createElement('div');
                group.className = 'category-group';
                group.style.setProperty('--theme-color', catInfo.color);

                let itemsHtml = '';
                catData.items.forEach(item => {
                    itemsHtml += `
                        <li>
                            <span>${item.title} ${item.isFixed ? '📌' : ''}</span>
                            <div style="display: flex; align-items: center; gap: 4px; flex-shrink: 0;">
                                <span>₪${item.amount.toLocaleString()}</span>
                                <button class="delete-btn" onclick="deleteTransaction('${item.id}')">🗑️</button>
                            </div>
                        </li>
                    `;
                });

                group.innerHTML = `
                    <div class="category-header">
                        <span>${catName}</span>
                        <div class="category-actions">
                            <span class="category-total">₪${catData.total.toLocaleString()}</span>
                        </div>
                    </div>
                    <ul class="item-list">${itemsHtml}</ul>
                `;

                catContainer.appendChild(group);
            });
        }

        function toggleTheme() {
            const currentTheme = document.body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', newTheme);
        }
    </script>
</body>
</html>
