<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מנהל תקציב ויעדים חכם</title>
    <!-- אייקון בלשונית (Favicon) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💸</text></svg>">
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #edf2f7;
            --subtext-color: #718096;
            --primary: #2bc48a;
            --danger: #e74c3c;
            --accent: #3498db;
            --input-bg: #ffffff;
        }

        [data-theme="dark"] {
            --bg-color: #1a202c;
            --card-bg: #2d3748;
            --text-color: #f7fafc;
            --border-color: #4a5568;
            --subtext-color: #a0aec0;
            --input-bg: #1a202c;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            width: 100%;
            max-width: 680px;
        }

        .auth-container {
            max-width: 400px;
            margin: 40px auto;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .user-greeting {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent);
            margin-top: 4px;
        }

        .user-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1 { margin: 0; font-size: 1.8rem; }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.85rem;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
        }

        .theme-toggle-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }

        h2 {
            margin-top: 0;
            font-size: 1.15rem;
            color: var(--text-color);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        input, select, button {
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            background-color: var(--input-bg);
            color: var(--text-color);
        }

        input:focus, select:focus { outline: none; border-color: var(--accent); }

        button.btn-primary {
            background-color: var(--primary);
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        button.btn-primary:hover { opacity: 0.9; }

        .checkbox-label {
            display: flex; align-items: center; gap: 8px; font-size: 0.9rem; cursor: pointer; margin-top: 5px;
        }

        .summary-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px;
        }

        .summary-item {
            background-color: var(--bg-color); padding: 12px; border-radius: 8px; text-align: center;
        }

        .summary-item span { display: block; font-size: 1.3rem; font-weight: bold; margin-top: 4px; }
        .income-text { color: var(--primary); }
        .expense-text { color: var(--danger); }

        .progress-container {
            width: 100%; background-color: var(--border-color); border-radius: 8px; height: 12px; margin-top: 8px; overflow: hidden;
        }

        .progress-bar { height: 100%; width: 0%; background-color: var(--primary); transition: width 0.3s; }

        .category-group {
            background-color: var(--bg-color);
            border-right: 6px solid var(--theme-color, #3498db);
            border-radius: 8px; padding: 12px 15px; margin-bottom: 15px;
        }

        .category-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 1rem; margin-bottom: 6px; }
        .category-actions { display: flex; align-items: center; gap: 8px; }
        .category-total { font-size: 0.85rem; color: white; background-color: var(--theme-color, #3498db); padding: 2px 8px; border-radius: 12px; }

        ul.item-list { list-style: none; padding: 0; margin: 0; }
        ul.item-list li { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border-color); }
        ul.item-list li:last-child { border-bottom: none; }

        .delete-btn { background: none; border: none; color: var(--subtext-color); cursor: pointer; font-size: 1.1rem; }
        .delete-btn:hover { color: var(--danger); }

        .auth-toggle-link { color: var(--accent); cursor: pointer; text-align: center; font-size: 0.9rem; margin-top: 10px; }
        .error-message { color: var(--danger); font-size: 0.85rem; margin-top: 5px; }
        .loading-text { text-align: center; color: var(--subtext-color); font-size: 0.9rem; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- מסך התחברות / הרשמה -->
    <div id="authSection" class="container auth-container">
        <div class="card">
            <h2 id="authTitle">🔑 התחברות למערכת (בענן ☁️)</h2>
            <form id="authForm" class="form-group">
                <input type="text" id="authFullName" placeholder="שם מלא" style="display: none;">
                <input type="email" id="authEmail" placeholder="כתובת אימייל" required>
                <input type="password" id="authPassword" placeholder="סיסמה (לפחות 6 תווים)" minlength="6" required>
                <div id="authError" class="error-message"></div>
                <div id="authLoading" class="loading-text" style="display:none;">מתחבר לענן... ⏳</div>
                <button type="submit" id="authSubmitBtn" class="btn-primary">התחבר</button>
            </form>
            <div id="authToggleLink" class="auth-toggle-link" onclick="toggleAuthMode()">
                אין לך חשבון? לחץ כאן להרשמה
            </div>
        </div>
    </div>

    <!-- מסך האפליקציה הראשי -->
    <div id="appSection" class="container" style="display: none;">
        <div class="header-top">
            <div>
                <h1>💰 מנהל תקציב ויעדים</h1>
                <div id="userGreeting" class="user-greeting">היי, </div>
            </div>
            <div class="user-actions">
                <button id="themeToggle" class="theme-toggle-btn" onclick="toggleTheme()">🌙 מצב לילה</button>
                <button class="btn-small" onclick="logout()">התנתק 🚪</button>
            </div>
        </div>

        <div class="card">
            <h2>📅 בחירת תקופה לתצוגה</h2>
            <div class="form-row" style="margin-top: 10px;">
                <select id="selectedMonth" onchange="updateUI()"></select>
                <select id="selectedYear" onchange="updateUI()"></select>
            </div>
        </div>

        <div class="card">
            <h2>🎯 יעד הוצאות חודשי כולל</h2>
            <div class="form-group">
                <label>אחוז הוצאות מקסימלי מתוך ההכנסות (%):</label>
                <input type="number" id="targetPercent" value="80" min="1" max="100" onchange="saveUserDataToCloud()">
            </div>
            <div class="progress-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
            <p id="targetStatus" style="font-size: 0.85rem; color: var(--subtext-color); margin-top: 8px;"></p>
        </div>

        <div class="card">
            <h2>➕ הוספת תנועה חדשה</h2>
            <form id="financeForm" class="form-group">
                <input type="text" id="desc" placeholder="תיאור (לדוגמה: משכורת, דלק, רמי לוי)" required>

                <div class="form-row">
                    <input type="number" id="amount" step="0.01" placeholder="סכום (בש״ח)" required>
                    <select id="type">
                        <option value="expense">הוצאה 📉</option>
                        <option value="income">הכנסה 📈</option>
                    </select>
                </div>

                <div class="form-row">
                    <select id="category"></select>
                    <select id="paymentMethod">
                        <option value="כרטיס אשראי">💳 כרטיס אשראי</option>
                        <option value="מזומן">💵 מזומן</option>
                        <option value="העברה בנקאית">🏦 העברה בנקאית</option>
                        <option value="ביט / פייבוקס">📱 ביט / פייבוקס</option>
                        <option value="צ׳ק">📝 צ׳ק</option>
                    </select>
                </div>

                <label class="checkbox-label">
                    <input type="checkbox" id="isFixed"> 📌 לסמן כהוצאה/הכנסה קבועה חודשית
                </label>

                <button type="submit" class="btn-primary">הוסף תנועה</button>
            </form>
        </div>

        <div class="card">
            <h2>📊 סיכום חודשי</h2>
            <div class="summary-grid">
                <div class="summary-item">הכנסות <span id="totalIncome" class="income-text">0 ₪</span></div>
                <div class="summary-item">הוצאות <span id="totalExpense" class="expense-text">0 ₪</span></div>
                <div class="summary-item" id="netBalanceBox">מאזן נטו <span id="netBalance">0 ₪</span></div>
                <div class="summary-item" id="usedPercentBox">ניצול תקציב <span id="usedPercent">0%</span></div>
            </div>
        </div>

        <div class="card">
            <h2>📂 תנועות לפי קטגוריה</h2>
            <div id="groupedList"></div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDxrq20TrCGAsSwHdkcAQS7WBl5xmKAu44",
            authDomain: "moneymanagement-84522.firebaseapp.com",
            projectId: "moneymanagement-84522",
            storageBucket: "moneymanagement-84522.firebasestorage.app",
            messagingSenderId: "846355309588",
            appId: "1:846355309588:web:91ea4a97640b6eaaf73301"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentUserDocId = null;
        let currentUserData = null;
        let isSignUpMode = false;

        const monthsList = ["ינואר", "פברואר", "מרץ", "אפריל", "מאי", "יוני", "יולי", "אוגוסט", "ספטמבר", "אוקטובר", "נובמבר", "דצמבר"];
        const defaultCategoriesList = [
            "כללי 📦", "משכורת והכנסות 💵", "רכב 🚗", "אוכל וסופר 🛒",
            "פנאי, חוגים וספורט 🥋", "חשבונות ודיור 🏠", "השקעות וחיסכון 📈"
        ];

        const authSection = document.getElementById('authSection');
        const appSection = document.getElementById('appSection');
        const authForm = document.getElementById('authForm');
        const authTitle = document.getElementById('authTitle');
        const authFullName = document.getElementById('authFullName');
        const authEmail = document.getElementById('authEmail');
        const authPassword = document.getElementById('authPassword');
        const authSubmitBtn = document.getElementById('authSubmitBtn');
        const authToggleLink = document.getElementById('authToggleLink');
        const authError = document.getElementById('authError');
        const authLoading = document.getElementById('authLoading');
        const userGreeting = document.getElementById('userGreeting');

        const selectedMonthEl = document.getElementById('selectedMonth');
        const selectedYearEl = document.getElementById('selectedYear');
        const financeForm = document.getElementById('financeForm');
        const descInput = document.getElementById('desc');
        const amountInput = document.getElementById('amount');
        const typeInput = document.getElementById('type');
        const categoryInput = document.getElementById('category');
        const paymentMethodInput = document.getElementById('paymentMethod');
        const isFixedInput = document.getElementById('isFixed');
        const targetPercentInput = document.getElementById('targetPercent');

        const totalIncomeEl = document.getElementById('totalIncome');
        const totalExpenseEl = document.getElementById('totalExpense');
        const netBalanceEl = document.getElementById('netBalance');
        const usedPercentEl = document.getElementById('usedPercent');
        const groupedList = document.getElementById('groupedList');
        const targetStatus = document.getElementById('targetStatus');
        const progressBar = document.getElementById('progressBar');

        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            authError.textContent = '';
            if (isSignUpMode) {
                authTitle.textContent = '📝 הרשמה לחשבון ענן';
                authFullName.style.display = 'block';
                authFullName.required = true;
                authSubmitBtn.textContent = 'הירשם והתחבר';
                authToggleLink.textContent = 'כבר יש לך חשבון? לחץ כאן להתחברות';
            } else {
                authTitle.textContent = '🔑 התחברות למערכת (בענן ☁️)';
                authFullName.style.display = 'none';
                authFullName.required = false;
                authSubmitBtn.textContent = 'התחבר';
                authToggleLink.textContent = 'אין לך חשבון? לחץ כאן להרשמה';
            }
        }

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            authError.textContent = '';
            authLoading.style.display = 'block';
            authSubmitBtn.disabled = true;

            const email = authEmail.value.trim().toLowerCase();
            const password = authPassword.value;

            try {
                if (isSignUpMode) {
                    const fullName = authFullName.value.trim();
                    const userCheck = await db.collection('users').where('email', '==', email).get();
                    if (!userCheck.empty) {
                        authError.textContent = 'משתמש עם אימייל זה כבר קיים!';
                        authLoading.style.display = 'none';
                        authSubmitBtn.disabled = false;
                        return;
                    }

                    const newUser = {
                        email: email,
                        password: password,
                        fullName: fullName,
                        categories: defaultCategoriesList,
                        categoryBudgets: {},
                        targetPercent: 80,
                        transactions: []
                    };

                    const docRef = await db.collection('users').add(newUser);
                    currentUserDocId = docRef.id;
                    currentUserData = newUser;
                    loginSuccess();
                } else {
                    const snapshot = await db.collection('users')
                        .where('email', '==', email)
                        .where('password', '==', password)
                        .get();

                    if (snapshot.empty) {
                        authError.textContent = 'אימייל או סיסמה לא נכונים';
                        authLoading.style.display = 'none';
                        authSubmitBtn.disabled = false;
                        return;
                    }

                    snapshot.forEach(doc => {
                        currentUserDocId = doc.id;
                        currentUserData = doc.data();
                    });
                    loginSuccess();
                }
            } catch (err) {
                authError.textContent = 'שגיאה בתקשורת עם הענן: ' + err.message;
            } finally {
                authLoading.style.display = 'none';
                authSubmitBtn.disabled = false;
            }
        });

        function loginSuccess() {
            authSection.style.display = 'none';
            appSection.style.display = 'block';
            userGreeting.textContent = `היי, ${currentUserData.fullName}`;
            initDateSelectors();
            renderCategories();
            updateUI();
        }

        function logout() {
            currentUserDocId = null;
            currentUserData = null;
            authSection.style.display = 'block';
            appSection.style.display = 'none';
            authForm.reset();
        }

        async function saveUserDataToCloud() {
            if (!currentUserDocId || !currentUserData) return;
            currentUserData.targetPercent = parseFloat(targetPercentInput.value) || 80;
            await db.collection('users').doc(currentUserDocId).update(currentUserData);
        }

        financeForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUserData) return;

            const newT = {
                id: Date.now().toString(),
                desc: descInput.value,
                amount: parseFloat(amountInput.value),
                type: typeInput.value,
                category: categoryInput.value,
                paymentMethod: paymentMethodInput.value,
                isFixed: isFixedInput.checked,
                month: parseInt(selectedMonthEl.value),
                year: parseInt(selectedYearEl.value)
            };

            currentUserData.transactions.push(newT);
            await saveUserDataToCloud();

            descInput.value = '';
            amountInput.value = '';
            isFixedInput.checked = false;
            updateUI();
        });

        async function deleteTransaction(id) {
            currentUserData.transactions = currentUserData.transactions.filter(t => t.id !== id);
            await saveUserDataToCloud();
            updateUI();
        }

        function initDateSelectors() {
            const now = new Date();
            selectedMonthEl.innerHTML = '';
            selectedYearEl.innerHTML = '';

            monthsList.forEach((m, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.textContent = m;
                if (idx === now.getMonth()) opt.selected = true;
                selectedMonthEl.appendChild(opt);
            });

            const currentYear = now.getFullYear();
            for (let y = currentYear - 2; y <= currentYear + 3; y++) {
                const opt = document.createElement('option');
                opt.value = y;
                opt.textContent = y;
                if (y === currentYear) opt.selected = true;
                selectedYearEl.appendChild(opt);
            }
        }

        function renderCategories() {
            categoryInput.innerHTML = '';
            (currentUserData.categories || defaultCategoriesList).forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                categoryInput.appendChild(opt);
            });
        }

        function toggleTheme() {
            const currentTheme = document.body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', newTheme);
            document.getElementById('themeToggle').textContent = newTheme === 'dark' ? '☀️ מצב יום' : '🌙 מצב לילה';
        }

        function updateUI() {
            if (!currentUserData) return;
            const curM = parseInt(selectedMonthEl.value);
            const curY = parseInt(selectedYearEl.value);

            const filtered = (currentUserData.transactions || []).filter(t => {
                return (t.month === curM && t.year === curY) || t.isFixed;
            });

            let totalIncome = 0;
            let totalExpense = 0;
            const groups = {};

            filtered.forEach(t => {
                if (t.type === 'income') totalIncome += t.amount;
                else totalExpense += t.amount;

                if (!groups[t.category]) {
                    groups[t.category] = { name: t.category, items: [], type: t.type, totalSum: 0 };
                }
                groups[t.category].items.push(t);
                groups[t.category].totalSum += t.amount;
            });

            groupedList.innerHTML = '';

            if (Object.keys(groups).length === 0) {
                groupedList.innerHTML = '<p style="color: var(--subtext-color); text-align: center;">אין תנועות להצגה לתקופה זו</p>';
            } else {
                Object.values(groups).forEach(group => {
                    const catBox = document.createElement('div');
                    catBox.className = 'category-group';

                    let itemsHtml = '';
                    group.items.forEach(t => {
                        const isInc = t.type === 'income';
                        itemsHtml += `
                            <li>
                                <div>
                                    <span>${t.desc}</span>
                                    <div style="font-size: 0.8rem; color: var(--subtext-color);">${t.paymentMethod}</div>
                                </div>
                                <div>
                                    <span class="${isInc ? 'income-text' : 'expense-text'}">
                                        ${isInc ? '+' : '-'}${t.amount.toLocaleString()} ₪
                                    </span>
                                    <button class="delete-btn" onclick="deleteTransaction('${t.id}')">✕</button>
                                </div>
                            </li>
                        `;
                    });

                    catBox.innerHTML = `
                        <div class="category-header">
                            <span>${group.name}</span>
                            <span class="category-total">סה״כ: ${group.totalSum.toLocaleString()} ₪</span>
                        </div>
                        <ul class="item-list">${itemsHtml}</ul>
                    `;
                    groupedList.appendChild(catBox);
                });
            }

            const netBalance = totalIncome - totalExpense;
            const targetPercent = currentUserData.targetPercent || 80;
            const usedPercent = totalIncome > 0 ? ((totalExpense / totalIncome) * 100) : 0;

            totalIncomeEl.textContent = `${totalIncome.toLocaleString()} ₪`;
            totalExpenseEl.textContent = `${totalExpense.toLocaleString()} ₪`;
            netBalanceEl.textContent = `${netBalance.toLocaleString()} ₪`;
            usedPercentEl.textContent = `${usedPercent.toFixed(1)}%`;

            progressBar.style.width = `${Math.min(usedPercent, 100)}%`;

            if (usedPercent > targetPercent || netBalance < 0) {
                targetStatus.textContent = `🚨 אזהרה: חריגה מהיעד! ניצול של ${usedPercent.toFixed(1)}% מתוך יעד של ${targetPercent}%.`;
                targetStatus.style.color = 'var(--danger)';
                progressBar.style.backgroundColor = 'var(--danger)';
            } else {
                targetStatus.textContent = `✅ עומד ביעד! נשאר לפחות ${(100 - targetPercent)}% לחיסכון.`;
                targetStatus.style.color = 'var(--primary)';
                progressBar.style.backgroundColor = 'var(--primary)';
            }
        }
    </script>
</body>
</html>
